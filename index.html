<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1A1A">
<title>BSCS | 2025 – 2029 | Aspire College, Vehari</title>
<meta name="description" content="Class cloud storage for BSCS 2025 – 2029, Aspire College, Vehari.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preload" href="assets/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><img src="icon.png" alt="" width="28" height="28"><div class="bn"><b>BSCS › 2025 – 2029</b><span>Aspire College, Vehari</span></div></div>
  <nav id="nav" aria-label="Folders"></nav>
  <button class="btn" id="adminBtn">Admin</button>
</aside>
<main>
  <div class="top">
    <label class="search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg><input id="q" type="search" placeholder="Search by folder or file name" autocomplete="off" aria-label="Search"></label>
    <button class="ib" id="theme" title="Toggle theme" aria-label="Toggle theme">&#9680;</button>
  </div>
  <h1 id="title">Storage</h1>
  <div class="crumbs" id="crumbs" hidden></div>
  <div class="bar" id="bar" hidden>
    <div class="adm"><button class="btn p" id="up">Upload</button><button class="btn" id="upd">Upload folder</button><button class="btn" id="nf">New folder</button></div>
    <button class="btn" id="dlDir" hidden>Download folder</button>
    <div class="sel-bar" id="sb"><span id="sc"></span><button class="btn p" id="dlSel">Download ZIP</button><button class="btn adm" id="delSel">Delete</button><button class="btn" id="clr">Clear</button></div>
  </div>
  <div class="list" id="list" role="list"></div>
  <div id="recent"></div>
</main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Preview"><div class="pv"><header><b id="pn"></b><button class="btn" id="pd">Download</button><button class="btn" id="px" aria-label="Close">&#10005;</button></header><div class="pb" id="pb"></div></div></div>
<div class="modal" id="login" role="dialog" aria-modal="true" aria-label="Admin sign in"><div class="pv login"><header><b>Admin sign in</b><button class="btn" id="lx" aria-label="Close">&#10005;</button></header>
  <div class="in"><p class="hint">Paste a GitHub fine-grained token with <b>Contents: Read and write</b> access to this repository only. It is kept in this browser and sent only to GitHub.</p>
  <input id="tk" class="fld" type="password" placeholder="github_pat_..." autocomplete="off" aria-label="GitHub token">
  <label><input class="cb" type="checkbox" id="rm"> Remember on this device</label><div class="hint" id="le" role="status"></div><button class="btn p" id="ls">Sign in</button></div></div></div>
<div class="menu" id="menu" role="menu"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fi" multiple hidden><input type="file" id="fd" webkitdirectory hidden>
<script src="assets/app.js" defer></script>
</body>
</html>
